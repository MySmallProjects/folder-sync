<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FolderSyncEr — Server File Viewer</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-panel: #1e293b;
            --bg-hover: #334155;
            --bg-selected: #1d4ed8;
            --border: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand h1 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .badge {
            font-size: 12px;
            padding: 3px 10px;
            border-radius: 999px;
            font-weight: 600;
            background: #334155;
            color: var(--text-secondary);
        }

        .badge.online {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .badge.offline {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .btn {
            background-color: var(--accent);
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 7px 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn.secondary {
            background-color: #334155;
            color: var(--text-primary);
        }

        .btn.secondary:hover {
            background-color: #475569;
        }

        .btn.danger {
            background-color: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.35);
        }

        .btn.danger:hover {
            background-color: rgba(239, 68, 68, 0.35);
        }

        /* Login View */
        #login-view {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-card {
            background-color: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            width: 100%;
            max-width: 400px;
            padding: 28px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        }

        .login-card h2 {
            font-size: 20px;
            margin-bottom: 6px;
        }

        .login-card p {
            color: var(--text-secondary);
            font-size: 13px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .form-group input[type="text"],
        .form-group input[type="password"] {
            width: 100%;
            padding: 9px 12px;
            background-color: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 14px;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .error-box {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: #fca5a5;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }

        /* Browser View */
        #browser-view {
            flex: 1;
            display: none;
            flex-direction: column;
            padding: 16px 24px;
            gap: 14px;
            height: calc(100vh - 57px);
        }

        .toolbar {
            background-color: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .toolbar-left, .toolbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .search-input {
            background-color: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            padding: 6px 12px;
            font-size: 13px;
            min-width: 240px;
        }

        .checkbox-label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
            user-select: none;
        }

        .stats-bar {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .workspace {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 16px;
            min-height: 0;
        }

        @media (max-width: 900px) {
            .workspace {
                grid-template-columns: 1fr;
            }
        }

        .tree-panel, .details-panel {
            background-color: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .panel-header {
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tree-container {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
            font-size: 13.5px;
        }

        .tree-node {
            user-select: none;
        }

        .tree-row {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            cursor: pointer;
            border-left: 3px solid transparent;
            transition: background-color 0.1s;
        }

        .tree-row:hover {
            background-color: var(--bg-hover);
        }

        .tree-row.selected {
            background-color: rgba(59, 130, 246, 0.22);
            border-left-color: var(--accent);
        }

        .tree-row.deleted .node-name {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .tree-toggle {
            width: 16px;
            text-align: center;
            font-size: 11px;
            color: var(--text-secondary);
            flex-shrink: 0;
        }

        .node-icon {
            flex-shrink: 0;
            font-size: 15px;
        }

        .node-name {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .node-meta {
            font-size: 11.5px;
            color: var(--text-muted);
            margin-left: 8px;
            white-space: nowrap;
        }

        .tag-deleted {
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 4px;
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            margin-left: 6px;
        }

        .tree-children {
            display: block;
        }

        .tree-children.collapsed {
            display: none;
        }

        .empty-state {
            padding: 40px 20px;
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Details Panel */
        .details-body {
            padding: 16px;
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .detail-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-muted);
            font-weight: 600;
        }

        .detail-value {
            font-size: 13px;
            color: var(--text-primary);
            word-break: break-all;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        .preview-box {
            background-color: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 12px;
            color: #e2e8f0;
            max-height: 240px;
            overflow: auto;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <header>
        <div class="brand">
            <span style="font-size: 22px;">📁</span>
            <h1>FolderSyncEr Server Viewer</h1>
            <span id="server-status-badge" class="badge">Checking API...</span>
        </div>
        <div class="header-right">
            <span id="user-info" style="display: none;"></span>
            <a href="/swagger" target="_blank" class="btn secondary" style="text-decoration: none;">Swagger API</a>
            <button id="logout-btn" class="btn danger" style="display: none;">Sign Out</button>
        </div>
    </header>

    <!-- Login Section -->
    <main id="login-view">
        <div class="login-card">
            <h2>Sign In to Server</h2>
            <p>Authenticate against <code>/api/auth/login</code> to browse server files.</p>
            <div id="login-error" class="error-box"></div>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" value="admin" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" value="AdminPassword123!" required autocomplete="current-password">
                </div>
                <button type="submit" id="login-submit-btn" class="btn" style="width: 100%; justify-content: center; padding: 10px;">
                    Sign In
                </button>
            </form>
        </div>
    </main>

    <!-- Authenticated File TreeView Section -->
    <section id="browser-view">
        <div class="toolbar">
            <div class="toolbar-left">
                <input type="text" id="search-input" class="search-input" placeholder="Filter files or folders by path...">
                <label class="checkbox-label">
                    <input type="checkbox" id="include-deleted-checkbox">
                    Show Deleted (Trash)
                </label>
            </div>
            <div class="toolbar-right">
                <span id="stats-summary" class="stats-bar">0 files</span>
                <button id="expand-all-btn" class="btn secondary">Expand All</button>
                <button id="collapse-all-btn" class="btn secondary">Collapse All</button>
                <button id="refresh-btn" class="btn">↻ Refresh</button>
            </div>
        </div>

        <div class="workspace">
            <div class="tree-panel">
                <div class="panel-header">
                    <span>Server File Tree</span>
                    <span id="snapshot-seq-label"></span>
                </div>
                <div id="tree-container" class="tree-container">
                    <div class="empty-state">Loading files from API...</div>
                </div>
            </div>

            <div class="details-panel">
                <div class="panel-header">
                    <span>Item Metadata</span>
                </div>
                <div id="details-body" class="details-body">
                    <div class="empty-state">Select a file or folder in the tree to inspect its server metadata.</div>
                </div>
            </div>
        </div>
    </section>

    <script src="/app.js"></script>
</body>
</html>
